# Provided. Mount it into the web container (read only) at /etc/nginx/conf.d/default.conf
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # the browser calls /api/..., the API expects /...
    location /api/ {
        proxy_pass http://pw-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}
